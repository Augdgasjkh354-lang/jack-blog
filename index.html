<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f0e8">
  <title>个人工作台</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;font-family:ui-serif,"Noto Serif CJK SC","Noto Serif SC","Songti SC",serif}
    button,input,textarea,select{font:inherit}
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-thumb{background:var(--rule)}
    
    [data-t="light"]{
      --ink:#1a1612;--ink-l:#4a3f35;--ink-f:#8a7a6a;
      --paper:#f5f0e8;--paper-w:#ede7d9;--paper-d:#e0d8c8;
      --rule:#c8bfb0;--red:#8b2500;--red-bg:rgba(139,37,0,.07);
      background:var(--paper);color:var(--ink);color-scheme:light
    }
    [data-t="dark"]{
      --ink:#e0d8c8;--ink-l:#b0a898;--ink-f:#7a7060;
      --paper:#1c1a16;--paper-w:#242218;--paper-d:#2e2a24;
      --rule:#3a3428;--red:#d05030;--red-bg:rgba(208,80,48,.12);
      background:var(--paper);color:var(--ink);color-scheme:dark
    }
    
    .app{display:flex;flex-direction:column;height:100vh;background:var(--paper);color:var(--ink);overflow:hidden}
    .app-body{flex:1;overflow:hidden;display:flex;flex-direction:column}
    
    
    
    
    
    
    
    .hd{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:50px;border-bottom:1.5px solid var(--ink);background:var(--paper);flex-shrink:0}
    .hd-title{font-family:Georgia,serif;font-size:18px;letter-spacing:.04em;font-weight:600}
    .hd-acts{display:flex;gap:6px;align-items:center}
    
    .bn{font-size:12px;padding:5px 12px;border:1px solid var(--ink-l);background:transparent;color:var(--ink-l);cursor:pointer;letter-spacing:.04em;transition:all .2s}
    .bn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
    .bn.p{background:var(--red);color:#f5f0e8;border-color:var(--red)}
    .bn.p:hover{background:var(--red);opacity:.9}
    
    .search-wrap{padding:10px 14px;border-bottom:1px solid var(--rule);background:var(--paper-w);flex-shrink:0}
    .search-input{width:100%;font-size:14px;padding:8px 10px;background:var(--paper);border:1px solid var(--rule);color:var(--ink);outline:none;transition:border .2s}
    .search-input:focus{border-color:var(--ink-l)}
    
    .empty{display:flex;align-items:center;justify-content:center;flex:1;color:var(--ink-f);font-size:13px;text-align:center;padding:24px}
    .list{flex:1;overflow-y:auto}
    
    .fab{position:absolute;bottom:16px;right:16px;width:48px;height:48px;border-radius:50%;background:var(--red);color:#f5f0e8;border:0;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.2);z-index:10;transition:transform .2s}
    .fab:hover{transform:scale(1.05)}
    .fab:active{transform:scale(0.95)}
    
    .back-bar{display:flex;align-items:center;gap:6px;padding:10px 16px;border-bottom:1px solid var(--rule);cursor:pointer;font-size:13px;color:var(--ink-l);background:var(--paper-w);flex-shrink:0}
    .back-bar:hover{background:var(--paper-d)}
    
    .mono{font-family:"Courier New",monospace}
    
    .card{padding:14px 20px;border-bottom:1px solid var(--paper-d);cursor:pointer;transition:background .2s}
    .card:hover{background:var(--paper-w)}
    
    .card-title{font-size:14px;font-weight:500;color:var(--ink)}
    .card-meta{font-family:"Courier New",monospace;font-size:10px;color:var(--ink-f);margin-top:3px}
    .card-preview{font-size:13px;color:var(--ink-l);margin-top:4px;line-height:1.5;font-weight:300;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    
    .modal-ov{position:fixed;inset:0;background:rgba(26,22,18,.6);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
    .modal-ov.show{opacity:1;pointer-events:auto}
    
    .modal{background:var(--paper);padding:24px;width:430px;max-width:92vw;border:1px solid var(--ink);border-radius:2px;max-height:90vh;overflow-y:auto}
    .modal h3{font-size:15px;font-weight:500;margin-bottom:12px}
    .modal-f{margin-bottom:15px}
    .modal-f label{display:block;font-family:"Courier New",monospace;font-size:10px;letter-spacing:.14em;color:var(--ink-f);text-transform:uppercase;margin-bottom:4px}
    .modal-f input,.modal-f textarea,.modal-f select{width:100%;font-size:14px;line-height:1.7;padding:8px 10px;background:var(--paper-w);border:1px solid var(--rule);border-bottom:2px solid var(--rule);color:var(--ink);outline:none;transition:border .2s}
    .modal-f input:focus,.modal-f textarea:focus,.modal-f select:focus{border-color:var(--ink-l)}
    .modal-f textarea{resize:vertical;min-height:70px}
    .modal-acts{display:flex;gap:6px;justify-content:flex-end;margin-top:18px}
    
    .toast{position:fixed;left:50%;bottom:68px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 12px;border-radius:4px;font-size:12px;z-index:200;animation:slideUp .3s ease-out}
    @keyframes slideUp{from{transform:translateX(-50%) translateY(20px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
    
    .content-area{flex:1;overflow-y:auto;padding:20px; transition: opacity 0.3s ease-in-out; }
    .content-title{font-size:20px;font-weight:600;margin-bottom:16px;color:var(--ink)}
    
    .word-item{padding:13px 20px;border-bottom:1px solid var(--paper-d);cursor:pointer;transition:background .2s}
    .word-item:hover{background:var(--paper-w)}
    .word-name{font-size:16px;font-weight:600;color:var(--ink)}
    .word-wrong{font-size:10px;color:var(--ink-f);font-family:"Courier New",monospace;margin-top:2px}
    .word-def{font-size:13px;color:var(--ink-l);line-height:1.65;font-weight:300;margin-top:4px}
    
    .detail-panel{padding:28px 32px;max-width:760px}
    .detail-title{font-size:20px;font-weight:600;margin-bottom:16px;color:var(--ink)}
    .detail-section{margin-bottom:22px}
    .detail-label{font-family:"Courier New",monospace;font-size:10px;letter-spacing:.14em;color:var(--ink-f);text-transform:uppercase;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--rule)}
    .detail-text{font-size:14px;line-height:1.85;font-weight:300;color:var(--ink)}
    .detail-text.hl{background:var(--red-bg);padding:10px 14px;border-left:3px solid var(--red);font-weight:400}
    
    .diary-calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:12px 16px}
    .diary-cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:8px 16px 0;font-family:"Courier New",monospace;font-size:10px;color:var(--ink-f);text-align:center}
    .diary-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:default;border-radius:2px;position:relative}
    .diary-day.has-entry{cursor:pointer;color:var(--red);font-weight:600}
    .diary-day.has-entry::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--red)}
    .diary-day.today{background:var(--paper-d)}
    .diary-day.other-month{color:var(--ink-f);opacity:.4}
    
    .music-player{padding:16px;background:var(--paper-w);border-radius:4px;margin-bottom:16px}
    .music-info{margin-bottom:12px}
    .music-title{font-size:14px;font-weight:500;color:var(--ink)}
    .music-controls{display:flex;gap:8px;margin-top:12px}
    .music-btn{padding:6px 12px;background:var(--red);color:#f5f0e8;border:none;cursor:pointer;font-size:12px;border-radius:2px;transition:opacity .2s}
    .music-btn:hover{opacity:.9}
    
    .file-item{padding:12px 16px;border-bottom:1px solid var(--paper-d);display:flex;justify-content:space-between;align-items:center}
    .file-name{font-size:13px;color:var(--ink);flex:1}
    .file-size{font-size:11px;color:var(--ink-f);font-family:"Courier New",monospace;margin:0 12px}
    .file-time{font-size:11px;color:var(--ink-f);font-family:"Courier New",monospace;min-width:100px}
    .file-actions{display:flex;gap:6px}
    .file-btn{padding:4px 8px;background:transparent;border:1px solid var(--rule);color:var(--ink-f);cursor:pointer;font-size:11px;transition:all .2s}
    .file-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
    
    .set-section{padding:16px 20px;border-bottom:1px solid var(--paper-d)}
    .set-label{font-size:11px;color:var(--ink-f);font-family:"Courier New",monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
    .set-options{display:flex;gap:8px;flex-wrap:wrap}
    .set-opt{font-size:13px;padding:7px 16px;border:1px solid var(--rule);background:transparent;color:var(--ink-l);cursor:pointer;transition:all .2s}
    .set-opt:hover{border-color:var(--ink)}
    .set-opt.on{background:var(--red);color:#f5f0e8;border-color:var(--red)}
    .set-data-btns{display:flex;gap:8px;margin-top:8px}
    
    .portfolio-item{padding:16px 20px;border-bottom:1px solid var(--paper-d);cursor:pointer;transition:background .2s}
    .portfolio-item:hover{background:var(--paper-w)}
    .portfolio-cover{width:100%;height:120px;background:var(--paper-d);border-radius:2px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;color:var(--ink-f);font-size:12px}
    .portfolio-title{font-size:14px;font-weight:500;color:var(--ink)}
    .portfolio-desc{font-size:12px;color:var(--ink-l);margin-top:4px;line-height:1.5}
    
    @media(max-width:639px){
      .hd{padding:0 16px}
      .modal{width:90vw}
      .detail-panel{padding:16px 18px}
      .content-area{padding:16px}
    }
  
    .music-progress-container { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
    .music-progress { flex: 1; height: 4px; background: var(--rule); border-radius: 2px; -webkit-appearance: none; appearance: none; cursor: pointer; }
    .music-progress::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--red); cursor: pointer; }
    .music-progress::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--red); cursor: pointer; }
    .music-time { font-size: 11px; color: var(--ink-f); font-family: "Courier New", monospace; }
    .music-volume-container { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
    .music-volume { width: 80px; height: 4px; background: var(--rule); border-radius: 2px; -webkit-appearance: none; appearance: none; cursor: pointer; }
    .music-volume::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--red); cursor: pointer; }
    .music-volume::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--red); cursor: pointer; }
    
  
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .content-area { animation: fadeIn 0.3s ease; }
    .back-bar{display:flex;align-items:center;gap:6px;padding:12px 20px;border-bottom:1px solid var(--rule);cursor:pointer;font-size:13px;color:var(--ink-l);background:var(--paper-w);flex-shrink:0;transition:background 0.2s}
    .back-bar:hover{background:var(--paper-d)}

  </style>
</head>
<body data-t="light">
<div id="lockScreen" style="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--paper);">
  <div style="text-align:center;max-width:320px;padding:24px;">
    <div style="font-family:Georgia,serif;font-size:24px;letter-spacing:.06em;margin-bottom:8px;color:var(--ink);">工作台</div>
    <div style="width:28px;height:2px;background:var(--red);margin:0 auto 24px;"></div>
    <div style="font-size:13px;color:var(--ink-f);margin-bottom:16px;">请输入密码以继续</div>
    <input type="password" id="lockPwd" placeholder="密码" style="width:100%;font-size:15px;padding:10px 14px;background:var(--paper-w);border:1px solid var(--rule);border-bottom:2px solid var(--rule);color:var(--ink);outline:none;text-align:center;letter-spacing:.1em;" onkeydown="if(event.key==='Enter')document.getElementById('lockBtn').click()">
    <div id="lockErr" style="font-size:12px;color:var(--red);margin-top:8px;min-height:18px;"></div>
    <button id="lockBtn" onclick="(function(){var p=document.getElementById('lockPwd').value;if(p==='jack'){sessionStorage.setItem('ws_unlocked','1');document.getElementById('lockScreen').style.display='none';}else{document.getElementById('lockErr').textContent='密码错误，请重试';document.getElementById('lockPwd').value='';}})()" style="margin-top:12px;font-size:13px;padding:8px 28px;background:var(--red);color:#f5f0e8;border:1px solid var(--red);cursor:pointer;letter-spacing:.06em;">进入</button>
  </div>
</div>
<script>if(sessionStorage.getItem('ws_unlocked')==='1'){document.getElementById('lockScreen').style.display='none';}</script>

<div class="app">
  <div class="hd">
    <div class="hd-title" id="headerTitle">工作台</div>
    <div class="hd-acts">
      <button class="bn" id="themeBtn" title="切换主题">🌙</button>
    </div>
  </div>
  
  <div class="app-body">
    <div id="mainView" class="content-area"></div>
  </div>
  
  </div>

<div class="modal-ov" id="modal">
  <div class="modal" id="modalContent"></div>
</div>

<div class="toast" id="toast" style="display:none"></div>

00:10:04Z"}, {"id": "entry_605", "word": "情绪智力", "wrong": "会哄人。", "right": "识别、理解、调节自己和他人情绪并用于行动的能力。", "fail": "在被用于操控、讨好或压抑真实感受时失效。", "border": "情绪智力不等于没有情绪。", "createdAt": "2026-05-16T00:10:05Z"}, {"id": "entry_606", "word": "共情疲劳", "wrong": "不想关心别人了。", "right": "长期接触他人痛苦后共情能力和情绪资源下降的状态。", "fail": "在缺乏恢复、边界和支持系统时加重。", "border": "共情疲劳不是冷漠，而是资源耗竭。", "createdAt": "2026-05-16T00:10:06Z"}, {"id": "entry_607", "word": "替代性创伤", "wrong": "听别人痛苦后难受。", "right": "长期接触他人创伤叙事后自身信念、情绪和安全感受到影响。", "fail": "在过度暴露、缺乏督导或边界薄弱时加深。", "border": "替代性创伤需要修复，而非意志硬扛。", "createdAt": "2026-05-16T00:10:07Z"}, {"id": "entry_608", "word": "心理韧性", "wrong": "抗压能力强。", "right": "人在压力、挫折和创伤后恢复、调整并继续生活的能力。", "fail": "在被要求无限忍耐或忽视支持系统时失效。", "border": "心理韧性不是不需要帮助。", "createdAt": "2026-05-16T00:10:08Z"}, {"id": "entry_609", "word": "心理弹性", "wrong": "想得开。", "right": "心理系统在变化和压力中灵活调整并维持功能的能力。", "fail": "在环境持续压迫或个体长期透支时下降。", "border": "弹性需要恢复条件，不是天生无限。", "createdAt": "2026-05-16T00:10:09Z"}, {"id": "entry_610", "word": "心理边界", "wrong": "不要别人靠太近。", "right": "区分自己与他人的情绪、责任、需求和选择的内在界限。", "fail": "在讨好、控制、共依存或情绪卷入中模糊。", "border": "心理边界保护连接，而不是取消连接。", "createdAt": "2026-05-16T00:10:10Z"}, {"id": "entry_611", "word": "自我效能", "wrong": "觉得自己很行。", "right": "个体相信自己能完成特定任务并影响结果的信念。", "fail": "在目标过大、反馈失败或缺乏技能时削弱。", "border": "自我效能针对具体任务，不是泛泛自信。", "createdAt": "2026-05-16T00:10:11Z"}, {"id": "entry_612", "word": "习得性无助", "wrong": "不想努力了。", "right": "在反复无效尝试后形成“行动无用”的稳定预期。", "fail": "在真实机会出现却仍放弃尝试时延续。", "border": "习得性无助是经验塑造的状态，不是人格缺陷。", "createdAt": "2026-05-16T00:10:12Z"}, {"id": "entry_613", "word": "积极心理", "wrong": "凡事往好处想。", "right": "关注优势、意义、幸福和成长条件的心理取向。", "fail": "在否认痛苦、强迫乐观或遮蔽结构问题时失效。", "border": "积极心理不等于拒绝负面情绪。", "createdAt": "2026-05-16T00:10:13Z"}, {"id": "entry_614", "word": "心流", "wrong": "特别投入。", "right": "能力与挑战匹配时产生的高度专注、顺畅和自我感减弱状态。", "fail": "在挑战过高、过低或干扰过多时难以出现。", "border": "心流需要结构化任务和即时反馈。", "createdAt": "2026-05-16T00:10:14Z"}, {"id": "entry_615", "word": "巅峰体验", "wrong": "最快乐的时刻。", "right": "人在高度整合、震撼或 class WorkbenchApp {
  constructor() {
    this.currentView = 'home';
    this.currentTheme = localStorage.getItem('theme') || 'light';
    this.fontSize = parseInt(localStorage.getItem('fontSize') || '14');
    this.selectedWordId = null;
    this.selectedQuoteId = null;
    this.selectedDiaryId = null;
    this.currentDiaryNotebook = null;
    this.currentMusicIndex = 0;
    this.isPlaying = false;
    this.currentAudio = null;
    
    this.initTheme();
    this.initData();
    this.attachEventListeners();
    this.render();
  }
  
  initTheme() {
    document.body.setAttribute('data-t', this.currentTheme);
    document.documentElement.style.fontSize = this.fontSize + 'px';
  }
  
  initData() {
    if (!localStorage.getItem('words')) {
      localStorage.setItem('words', JSON.stringify(WORDS_SEED));
    }
    if (!localStorage.getItem('quotes')) {
      localStorage.setItem('quotes', JSON.stringify([]));
    }
    if (!localStorage.getItem('diaries')) {
      localStorage.setItem('diaries', JSON.stringify([]));
    }
    if (!localStorage.getItem('notebooks')) {
      localStorage.setItem('notebooks', JSON.stringify([{id: 'nb-default', name: '默认笔记本', createdAt: Date.now()}]));
    }
    if (!localStorage.getItem('portfolio')) {
      localStorage.setItem('portfolio', JSON.stringify([]));
    }
  }
  
  attachEventListeners() {

    
    document.getElementById('themeBtn').addEventListener('click', () => {
      this.toggleTheme();
    });
    
    document.getElementById('modal').addEventListener('click', (e) => {
      if (e.target.id === 'modal') {
        this.closeModal();
      }
    });
  }
  
  switchView(view) {
    this.currentView = view;

    this.render();
  }
  
  toggleTheme() {
    this.currentTheme = this.currentTheme === 'light' ? 'dark' : 'light';
    localStorage.setItem('theme', this.currentTheme);
    document.body.setAttribute('data-t', this.currentTheme);
    document.getElementById('themeBtn').textContent = this.currentTheme === 'light' ? '🌙' : '☀';
  }
  
  showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 2000);
  }
  
  openModal(content) {
    const modal = document.getElementById('modal');
    const modalContent = document.getElementById('modalContent');
    modalContent.innerHTML = content;
    modal.classList.add('show');
  }
  
  closeModal() {
    document.getElementById('modal').classList.remove('show');
  }
  
  render() {
    const mainView = document.getElementById('mainView');
    let html = '';
    
    switch(this.currentView) {
      case 'home':
        html = this.renderHome();
        break;
      case 'words':
        html = this.renderWords();
        break;
      case 'quotes':
        html = this.renderQuotes();
        break;
      case 'diary':
        html = this.renderDiary();
        break;
      case 'music':
        html = this.renderMusic();
        break;
      case 'portfolio':
        html = this.renderPortfolio();
        break;
      case 'files':
        html = this.renderFiles();
        break;
      case 'settings':
        html = this.renderSettings();
        break;
    }
    
    mainView.innerHTML = html;
    this.attachViewListeners();
  }
  
  attachViewListeners() {
    // Words
    document.querySelectorAll('[data-word-id]').forEach(el => {
      el.addEventListener('click', () => {
        const wordId = el.getAttribute('data-word-id');
        this.showWordDetail(wordId);
      });
    });
    
    document.getElementById('addWordBtn')?.addEventListener('click', () => {
      this.showWordForm();
    });
    
    document.getElementById('searchWordsInput')?.addEventListener('input', (e) => {
      this.filterWords(e.target.value);
    });
    
    // Quotes
    document.getElementById('addQuoteBtn')?.addEventListener('click', () => {
      this.showQuoteForm();
    });
    
    document.getElementById('searchQuotesInput')?.addEventListener('input', (e) => {
      this.filterQuotes(e.target.value);
    });
    
    document.querySelectorAll('[data-quote-id]').forEach(el => {
      el.addEventListener('click', () => {
        const quoteId = el.getAttribute('data-quote-id');
        this.showQuoteDetail(quoteId);
      });
    });
    
    // Diary
    document.getElementById('addDiaryBtn')?.addEventListener('click', () => {
      this.showDiaryForm();
    });
    
    document.getElementById('addNotebookBtn')?.addEventListener('click', () => {
      this.showNotebookForm();
    });
    
    document.querySelectorAll('[data-diary-id]').forEach(el => {
      el.addEventListener('click', () => {
        const diaryId = el.getAttribute('data-diary-id');
        this.showDiaryDetail(diaryId);
      });
    });
    
    document.querySelectorAll('[data-notebook-id]').forEach(el => {
      el.addEventListener('click', () => {
        const nbId = el.getAttribute('data-notebook-id');
        this.currentDiaryNotebook = nbId;
        this.render();
      });
    });
    
    // Music
    document.getElementById('uploadMusicBtn')?.addEventListener('click', () => {
      this.showMusicUploadForm();
    });
    
    document.getElementById('playBtn')?.addEventListener('click', () => {
      this.playMusic();
    });
    
    document.getElementById('pauseBtn')?.addEventListener('click', () => {
      this.pauseMusic();
    });
    
    document.getElementById('prevBtn')?.addEventListener('click', () => {
      this.prevMusic();
    });
    
    document.getElementById('nextBtn')?.addEventListener('click', () => {
      this.nextMusic();
    });
    
    document.querySelectorAll('[data-music-id]').forEach(el => {
      el.addEventListener('click', () => {
        const musicId = el.getAttribute('data-music-id');
        this.selectMusic(musicId);
      });
    });

          this.downloadFile(fileId);

          this.deleteFile(fileId);
if (document.getElementById('playPauseBtn')) {
      const audio = document.getElementById('audioPlayer');
      const playPauseBtn = document.getElementById('playPauseBtn');
      const progressBar = document.getElementById('musicProgressBar');
      const currentTimeSpan = document.getElementById('currentTime');
      const totalTimeSpan = document.getElementById('totalTime');
      const volumeBar = document.getElementById('musicVolumeBar');

      if (audio && progressBar && currentTimeSpan && totalTimeSpan && volumeBar) {
        playPauseBtn.addEventListener('click', () => this.togglePlayPause());
        document.getElementById('prevMusicBtn').addEventListener('click', () => this.playPrevMusic());
        document.getElementById('nextMusicBtn').addEventListener('click', () => this.playNextMusic());

        audio.addEventListener('timeupdate', () => {
          if (!isNaN(audio.duration)) {
            progressBar.value = (audio.currentTime / audio.duration) * 100;
            currentTimeSpan.textContent = this.formatTime(audio.currentTime);
          }
        });
        audio.addEventListener('loadedmetadata', () => {
          totalTimeSpan.textContent = this.formatTime(audio.duration);
          progressBar.value = 0;
          volumeBar.value = audio.volume * 100;
        });
        audio.addEventListener('ended', () => {
          playPauseBtn.textContent = '播放';
          progressBar.value = 0;
          currentTimeSpan.textContent = '00:00';
        });
        progressBar.addEventListener('input', () => {
          audio.currentTime = (parseFloat(progressBar.value) / 100) * audio.duration;
        });
        volumeBar.addEventListener('input', () => {
          audio.volume = parseFloat(volumeBar.value) / 100;
        });
      }
    }
          }
      });
    });
    
    // Settings
    document.querySelectorAll('[data-theme-opt]').forEach(btn => {
      btn.addEventListener('click', () => {
        const theme = btn.getAttribute('data-theme-opt');
        this.currentTheme = theme;
        localStorage.setItem('theme', theme);
        document.body.setAttribute('data-t', theme);
        this.render();
      });
    });
    
    document.querySelectorAll('[data-size-opt]').forEach(btn => {
      btn.addEventListener('click', () => {

        localStorage.setItem('fontSize', size);
        document.documentElement.style.fontSize = size + 'px';
        this.render();
      });
    });
    
    document.getElementById('exportDataBtn')?.addEventListener('click', () => {
      this.exportData();
    });
    
    document.getElementById('importDataBtn')?.addEventListener('click', () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            try {
              const data = JSON.parse(event.target.result);
              Object.keys(data).forEach(key => {
                localStorage.setItem(key, JSON.stringify(data[key]));
              });
              this.showToast('数据导入成功');
              this.initData();
              this.render();
            } catch (err) {
              this.showToast('导入失败，请检查文件格式');

          reader.readAsText(file);
        }
      });
      input.click();

  saveWord(wordId) {
    const word = document.getElementById('wordInput').value.trim();
    const wrong = document.getElementById('wrongInput').value.trim();
    const right = document.getElementById('rightInput').value.trim();
    const fail = document.getElementById('failInput').value.trim();
    const border = document.getElementById('borderInput').value.trim();
    
    if (!word || !wrong || !right || !fail || !border) {
      this.showToast('请填写所有字段');
      return;
    }
    
    const words = JSON.parse(localStorage.getItem('words') || '[]');
    
    if (wordId) {
      const idx = words.findIndex(w => w.id === wordId);
      if (idx >= 0) {
        words[idx] = { ...words[idx], word, wrong, right, fail, border };
      }
    } else {
      words.push({
        id: 'w-' + Date.now(),
        word, wrong, right, fail, border,
        createdAt: Date.now()
      });
    }
    
    localStorage.setItem('words', JSON.stringify(words));
    this.closeModal();
    this.render();
    this.showToast(wordId ? '词条已更新' : '词条已保存');

      return;
    }
    
    const music = musicList[this.currentMusicIndex];
    if (!this.currentAudio) {
      const blob = new Blob([new Uint8Array(music.data)], { type: 'audio/mpeg' });
      const url = URL.createObjectURL(blob);
      this.currentAudio = new Audio(url);
    }
    
    this.currentAudio.play();
    this.isPlaying = true;
  }
  
  pauseMusic() {
    if (this.currentAudio) {
      this.currentAudio.pause();
      this.isPlaying = false;
    }
  }
  
  prevMusic() {

    this.currentAudio = null;
    this.render();
  }

    this.render();

  savePortfolio(portfolioId) {
    const title = document.getElementById('portfolioTitleInput').value.trim();
    const description = document.getElementById('portfolioDescInput').value.trim();
    const link = document.getElementById('portfolioLinkInput').value.trim();
    const coverInput = document.getElementById('portfolioCoverInput');
    
    if (!title || !description) {
      this.showToast('请填写标题和描述');
      return;
    }
    
    const portfolio = JSON.parse(localStorage.getItem('portfolio') || '[]');
    
    const processItem = (cover) => {
      if (portfolioId) {
        const idx = portfolio.findIndex(p => p.id === portfolioId);
        if (idx >= 0) {
          portfolio[idx] = { ...portfolio[idx], title, description, link, ...(cover && { cover }) };
        }
      } else {
        portfolio.push({
          id: 'pf-' + Date.now(),
          title, description, link, ...(cover && { cover }),
          createdAt: Date.now()
        });
      }
      
      localStorage.setItem('portfolio', JSON.stringify(portfolio));
      this.closeModal();
      this.render();
      this.showToast(portfolioId ? '作品已更新' : '作品已保存');
    };
    
    if (coverInput.files.length > 0) {
      const reader = new FileReader();
      reader.onload = (e) => {
        processItem(e.target.result);
      };
      reader.readAsDataURL(coverInput.files[0]);
    } else {
      processItem(null);
    }
  }

  uploadFile() {

      return;
    }

      const ext = file.name.split('.').pop().toLowerCase();
      
      files.push({

        type: ext,
        size: file.size,

  previewFile(fileId) {
    const files = JSON.parse(localStorage.getItem('files') || '[]');
    const file = files.find(f => f.id === fileId);
    
    if (!file) return;
    
    let content = '';
    if (file.type === 'txt') {
      const decoder = new TextDecoder();
      content = decoder.decode(new Uint8Array(file.data));
    } else if (file.type === 'html') {
      const decoder = new TextDecoder();
      content = decoder.decode(new Uint8Array(file.data));
    }
    
    const html = `
      <h3>${file.name}</h3>
      <div style="max-height:400px;overflow-y:auto;padding:12px;background:var(--paper-w);border:1px solid var(--rule);border-radius:2px;font-family:monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;">
        ${content.substring(0, 5000)}${content.length > 5000 ? '...' : ''}
      </div>
      <div class="modal-acts">
        <button class="bn" onclick="app.closeModal()">关闭</button>
      </div>
    `;
    this.openModal(html);
  }
  
  downloadFile(fileId) {
    const files = JSON.parse(localStorage.getItem('files') || '[]');
    const file = files.find(f => f.id === fileId);
    
    if (!file) return;
    
    const blob = new Blob([new Uint8Array(file.data)]);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = file.name;
    a.click();
    URL.revokeObjectURL(url);
  }

formatTime(seconds) {
    if (isNaN(seconds)) return '00:00';
    const minutes = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
  }

  togglePlayPause() {
    const audio = document.getElementById('audioPlayer');
    const playPauseBtn = document.getElementById('playPauseBtn');
    if (audio.paused) {
      audio.play();
      playPauseBtn.textContent = '暂停';
    } else {
      audio.pause();
      playPauseBtn.textContent = '播放';
    }
  }

  playPrevMusic() {
    const currentMusicIndex = this.musicList.findIndex(m => m.id === this.currentMusicId);
    if (currentMusicIndex > 0) {
      this.currentMusicId = this.musicList[currentMusicIndex - 1].id;
      this.render(); // Re-render to update UI
      this.playMusic(this.currentMusicId);
    } else {
      this.showToast('已经是第一首了');
    }
  }

  playNextMusic() {
    const currentMusicIndex = this.musicList.findIndex(m => m.id === this.currentMusicId);
    if (currentMusicIndex < this.musicList.length - 1) {
      this.currentMusicId = this.musicList[currentMusicIndex + 1].id;
      this.render(); // Re-render to update UI
      this.playMusic(this.currentMusicId);
    } else {
      this.showToast('已经是最后一首了');
    }
  }

  playMusic(musicId) {
    const music = this.musicList.find(m => m.id === musicId);
    if (music) {
      this.currentMusicId = musicId;
      const audio = document.getElementById('audioPlayer');
      if (audio) {
        audio.src = music.url;
        audio.load();
        audio.play();
        document.getElementById('playPauseBtn').textContent = '暂停';
        document.getElementById('currentMusicTitle').textContent = music.title;
      }
    }
  }

  parseMarkdown(text) {
    if (!text) return '';
    let html = text;
    html = html.replace(/^### (.*$)/gm, '<h3>$1</h3>');
    html = html.replace(/^## (.*$)/gm, '<h2>$1</h2>');
    html = html.replace(/^# (.*$)/gm, '<h1>$1</h1>');
    html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
    
    // Handle lists more robustly
    const list_regex = /^- (.*(?:
- .*)*)/gm; // Matches a list item and subsequent list items
    html = html.replace(list_regex, (match, p1) => {
        const items = p1.split(/
- /).map(item => `<li>${item.trim()}</li>`).join('');
        return `<ul>${items}</ul>`;
    });

    html = html.replace(/^> (.*$)/gm, '<blockquote>$1</blockquote>');
    html = html.replace(/`(.*?)`/g, '<code>$1</code>');
    html = html.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
    html = html.replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>');
    html = html.replace(/
/g, '<br>');
    return html;
  }
}
