<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8b2500">
  <meta name="description" content="True（原词刀）— 一把切开概念误区的词典。3000个词条，四个维度切开每个概念。">
  <title>True（原词刀）</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="manifest" href="manifest.json">
</head>
<body data-t="light">

<!-- 密码锁 -->
<div class="lock-screen" id="lockScreen">
  <div class="lock-box">
    <h1>True</h1>
    <div class="slogan">一把切开概念误区的词典</div>
    <div class="divider"></div>
    <div style="font-size:13px;color:var(--ink-f);margin-bottom:16px;">请输入密码以继续</div>
    <input type="password" id="lockPwd" placeholder="密码" onkeydown="if(event.key==='Enter')document.getElementById('lockBtn').click()">
    <div class="err" id="lockErr"></div>
    <button id="lockBtn">进入</button>
  </div>
</div>

<!-- 主应用 -->
<div class="app" id="app" style="display:none;">
  <div class="hd">
    <a class="hd-title" href="./index.html" title="返回此刻">True</a>
    <div class="hd-acts">
      <button class="bn" id="themeBtn" title="切换主题">🌙</button>
    </div>
  </div>
  <div class="app-body">
    <div id="mainView" class="content-area"></div>
  </div>

  <!-- 底部 Tab 导航 -->
  <nav class="tab-bar" id="tabBar">
    <button class="tab-item active" data-tab="dict" type="button">
      <span class="tab-icon">📖</span>
      <span class="tab-label">词典</span>
    </button>
    <button class="tab-item" data-tab="diary" type="button">
      <span class="tab-icon">📝</span>
      <span class="tab-label">日记</span>
    </button>
    <button class="tab-item" data-tab="draft" type="button">
      <span class="tab-icon">✏️</span>
      <span class="tab-label">草稿</span>
    </button>
  </nav>
</div>

<!-- 模态框 -->
<div class="modal-overlay" id="modal">
  <div class="modal" id="modalContent"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="js/storage.js"></script>
<script src="js/search.js"></script>
<script src="js/true-image-exporter.js"></script>
<script src="js/app.js"></script>
</body>
</html>
